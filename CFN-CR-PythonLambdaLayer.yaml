      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 900
      Role: !GetAtt LambdaLambdaExecutionRole.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel


Outputs:
  CRLambdaLayerX8664ARN:
    Description: ARN of the x86_64 builder Lambda
    Value: !GetAtt LayerBuilderX8664Function.Arn
    Export:
      Name: !Sub "cfn:lambdalayer-x86-64:${AWS::Region}:arn"
  CRLambdaLayerArm64ARN:
    Description: ARN of the arm64 builder Lambda
    Value: !GetAtt LayerBuilderArm64Function.Arn
    Export:
      Name: !Sub "cfn:lambdalayer-arm64:${AWS::Region}:arn"
